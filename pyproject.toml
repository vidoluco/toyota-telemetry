[project]
name = "toyota-telemetry"
version = "0.1.0"
description = "Driving analytics for a connected Toyota: sync, store, analyse and a local dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "pytoyoda>=5.2.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toyota_telemetry"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[project.scripts]
toyota = "toyota_telemetry.cli:main"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",    # long lines are handled by line-length above, not by nagging
  "RUF001",  # the interface text uses typographic characters on purpose
  "B008",    # FastAPI dependencies are function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
